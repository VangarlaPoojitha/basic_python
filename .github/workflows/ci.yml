name: CI - FastAPI Backend

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install bandit flake8

      #Security: Static code scan
      - name: Security Scan (Bandit)
        run: bandit -r backend/app

      #Code quality
      - name: Linting
        run: flake8 backend/app

      #Basic app import check
      - name: Test app startup
        run: |
          python -c "from backend.app.main import app; print('App loaded')"
